*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.58;transition:background-color var(--dur),color var(--dur)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar-bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{color:var(--title);font-weight:var(--h1w)}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ph{color:var(--muted);font-style:italic}
.small{font-size:12.5px;color:var(--muted);margin:0}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar-bg);color:var(--bar-ink);border-bottom:var(--bw) var(--bs) var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.bar-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.logo{font-family:var(--f-display);font-weight:800;font-size:20px;text-decoration:none;color:var(--bar-ink)}
.pill{font-family:var(--f-mono);font-size:12px;padding:2px 9px;border-radius:var(--rb);background:var(--sun-soft);color:var(--sun-ink);font-weight:500}
.polish{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--bar-ink)}
.polish .pl{opacity:.75}
.meter{position:relative;width:96px;height:9px;border-radius:var(--rb);background:var(--soft);border:1px solid var(--line);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--sun),var(--accent));border-radius:inherit}
.polish b{font-variant-numeric:tabular-nums;min-width:3ch;font-weight:500}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .8s cubic-bezier(.2,.8,.2,1)}}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.jump{display:flex;align-items:center;gap:6px;font-size:12.5px;font-family:var(--f-mono);color:var(--bar-ink)}
.jump span{opacity:.75}
.jump select{background:var(--soft);border:1px solid var(--line);border-radius:var(--rb);padding:4px 8px;font-size:12.5px;font-family:var(--f-mono);color:var(--ink)}
.rec{font-family:var(--f-mono);font-size:12px;color:var(--bar-ink);opacity:.8;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.rec i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
@media (prefers-reduced-motion:no-preference){.rec i{animation:blink 1.6s infinite}}
@keyframes blink{50%{opacity:.25}}

.btn{display:inline-flex;align-items:center;gap:8px;border:var(--bw) var(--btn-bs) var(--line);background:var(--btn-bg);padding:9px 16px;border-radius:var(--rb);cursor:pointer;font-size:14.5px;font-weight:500;text-decoration:none;color:var(--ink);transition:transform var(--dur),border-color var(--dur),box-shadow var(--dur)}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.sm{padding:4px 12px;font-size:13px}
.btn.big{padding:13px 22px;font-size:16px}

/* update bar */
.update{background:var(--sun-soft);border-bottom:var(--bw) var(--bs) var(--line)}
.update-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.update-txt{flex:1;min-width:220px;font-size:14px}
.update-txt b{font-family:var(--f-mono)}
.up-pol{font-family:var(--f-mono);font-size:12.5px;color:var(--sun-ink);white-space:nowrap}
.prog{height:4px} .prog i{display:block;height:100%;width:0;background:var(--accent)}

main{padding-block:12px 72px}
.view{display:flex;flex-direction:column;gap:var(--gap)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.block{display:flex;flex-direction:column;gap:14px}
.block>h2{font-size:24px}
.box,.tile{background:var(--surface);border:var(--bw) var(--bs) var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* cover */
.cover-hero{padding-top:40px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.cover-hero h1{font-size:clamp(40px,7.5vw,74px);line-height:1}
.hl{background:linear-gradient(transparent 62%,var(--sun) 62%);padding:0 .06em}
.lede{font-size:18px;color:var(--muted);max-width:54ch;margin:14px 0 0}
.shapes{display:grid;grid-template-columns:repeat(2,72px);gap:12px}
.shapes span{width:72px;height:72px;border-radius:20px}
.shapes span:nth-child(1){background:var(--accent)} .shapes span:nth-child(2){background:var(--sun);border-radius:50%}
.shapes span:nth-child(3){background:var(--mint);border-radius:50% 50% 20px 20px} .shapes span:nth-child(4){background:var(--blue)}
.thesis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.thesis .box{padding:22px;display:flex;flex-direction:column;gap:8px}
.thesis h2{font-size:22px}
.thesis p{margin:0;color:var(--muted)}
.curve{width:100%;height:auto;margin-top:6px}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.why .box{padding:18px;display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--c)}
.why h3{font-size:17px}
.why p{margin:0;color:var(--muted);font-size:14.5px}
.start{display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--blue-soft);border-radius:var(--r);padding:24px}
.start h2{font-size:24px}
.start p{margin:0;max-width:60ch}

/* version page */
.vhead{padding-top:28px;display:flex;flex-direction:column;gap:10px}
.vtop{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.bigver{font-family:var(--f-display);font-weight:800;font-size:calc(clamp(64px,13vw,116px) * var(--hero));line-height:.92;color:var(--accent);letter-spacing:-.03em}
.vmeta{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.vhead h1{font-size:calc(clamp(28px,5vw,44px) * (0.6 + var(--hero) * 0.4));line-height:1.08}
.vhead p{margin:0;font-size:18px;color:var(--muted);max-width:56ch}
.design{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-family:var(--f-mono);font-size:12px;margin-top:4px}
.design .dl{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.design .ch{padding:2px 9px;border-radius:var(--rb);border:1px dashed currentColor}
.design .add{color:var(--mint)} .design .rm{color:var(--accent);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{padding:14px 16px;min-width:0}
.tile .k{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.2;color:var(--blue);font-variant-numeric:tabular-nums}
.ship{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ship li{display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
.ship li:last-child{border-bottom:0}
.ship li>span:last-child{min-width:0}
.tag{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:var(--rb);text-align:center;white-space:nowrap}
.t-new{background:var(--mint-soft);color:var(--mint)} .t-imp{background:var(--blue-soft);color:var(--blue)}
.t-dep{background:var(--dep-soft);color:var(--dep)} .t-known{background:var(--sun-soft);color:var(--sun-ink)}
.t-fix{background:var(--blue-soft);color:var(--blue)} .t-break{background:var(--accent-soft);color:var(--accent)}
.strengths{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.strengths .box{padding:16px;display:flex;flex-direction:column;gap:4px}
.strengths h3{font-size:16.5px}
.strengths p{margin:0;color:var(--muted);font-size:14px}
.learned{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15.5px}
.incident{padding:16px;display:flex;flex-direction:column;gap:12px}
.inc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.inc-top h3{font-size:16px}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;padding-bottom:14px}
.step:not(:last-child)::before{content:"";position:absolute;left:14px;top:28px;bottom:0;width:2px;background:var(--line)}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--surface)}
.step:nth-child(1) .dot{background:var(--accent)} .step:nth-child(2) .dot{background:var(--sun-ink)}
.step:nth-child(3) .dot{background:var(--blue)} .step:nth-child(4) .dot{background:var(--mint)}
.step b{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;padding-top:5px}
.step p{margin:2px 0 0}
@media (prefers-reduced-motion:no-preference){.step.new{animation:rise .35s ease-out}}
@keyframes rise{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.json{font-family:var(--f-mono);font-size:12px;background:var(--term-bg);color:var(--term-ink);border-radius:var(--r);padding:12px 14px;margin:0;overflow-x:auto;white-space:pre}
.points{display:flex;flex-direction:column;gap:12px}
.point{padding:18px;display:flex;flex-direction:column;gap:10px;border-left:5px solid var(--c)}
.point-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.point-top .ver{font-family:var(--f-mono);font-weight:500;color:var(--c)}
.point-top h3{font-size:18px}
.point-top .vmeta{margin-left:auto}
.point ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.ptabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ptab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px;border:var(--bw) var(--bs) var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink);transition:border-color var(--dur),transform var(--dur),box-shadow var(--dur)}
.ptab .ver{font-family:var(--f-mono);font-weight:500;font-size:12.5px;color:var(--c)}
.ptab:hover{border-color:var(--c);transform:translateY(-2px)}
.ptab.on{border-color:var(--c);background:var(--soft);box-shadow:inset 0 -4px 0 var(--c)}
.ppanel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;padding:24px;align-items:center;border-top:5px solid var(--c)}
.pstat{display:flex;flex-direction:column;gap:4px;min-width:150px}
.pstat .big{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.pstat span:last-child{font-size:13px;color:var(--muted);max-width:18ch}
.pbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.pbody p{margin:0;font-size:16.5px}
.pbody ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.ppanel{animation:rise .35s ease-out}}
.strengths:has(.sdet){align-items:start}
.sdet summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px}
.sdet summary::-webkit-details-marker{display:none}
.sdet .plus{font-family:var(--f-mono);color:var(--accent);font-size:20px;line-height:1;transition:transform var(--dur)}
.sdet[open] .plus{transform:rotate(45deg)}
.sdet p{margin:0;padding:0 16px 16px;color:var(--muted);font-size:14px}
.nextrel{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px}
.nextrel h2{font-size:26px}
.nextrel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.rollout-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rollout-top code{font-family:var(--f-mono);font-size:13.5px}
.pct{font-family:var(--f-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0}
.rollout-msg{font-size:14px;color:var(--muted);margin:0} .rollout-msg.done{color:var(--mint);font-weight:600}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:24px}
.ci{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;background:var(--term-bg);color:var(--term-ink);border-radius:var(--r);padding:32px 20px}
.ci h2{font-size:26px;color:inherit}
.ci p{margin:0;opacity:.75;max-width:52ch}

/* telemetry */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tiles .tile:nth-child(1) .v{color:var(--accent)} .tiles .tile:nth-child(2) .v{color:var(--blue)}
.tiles .tile:nth-child(3) .v{color:var(--mint)} .tiles .tile:nth-child(4) .v{color:var(--sun-ink)}
.panels{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
.panel{padding:16px;min-width:0}
.panel h3{font-size:16px;margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-r{display:grid;grid-template-columns:96px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.bar-r>span:first-child{font-family:var(--f-mono)}
.track{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px}
.secs{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.unseen{color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:12px}
.log li{display:flex;gap:10px} .log time{color:var(--muted);flex:none}
.sugg{background:var(--accent-soft);border-radius:var(--r);padding:20px}
.sugg h3{font-size:18px;margin-bottom:12px}
.sugg ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.closing{display:flex;flex-direction:column;gap:10px;background:var(--blue-soft);border-radius:var(--r);padding:22px}
.closing h2{font-size:24px}
.closing p{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:14px;z-index:40;max-width:calc(100% - 32px)}

/* ===== era details ===== */
/* v1: every 2018-homepage habit */
.retro{display:none;background:#ffff00;color:#000;font-family:"Times New Roman",serif;font-size:14px;text-align:center;padding-block:6px;border-bottom:2px solid #000}
:root[data-skin="v1"] .retro{display:block}
:root[data-skin="v1"] h2,:root[data-skin="v1"] h3{text-decoration:underline}
:root[data-skin="v1"] .btn.primary{background:var(--btn-bg);color:var(--ink);border-color:var(--line);font-weight:400}
:root[data-skin="v1"] .tile .v{color:var(--title)}
:root[data-skin="v1"] .meter i{background:var(--mint)}
:root[data-skin="v1"] .update{background:var(--sun-soft)}
/* v2: tidy but plain */
:root[data-skin="v2"] .meter i{background:var(--accent)}
:root[data-skin="v2"] .bigver{color:var(--ink);font-weight:700;letter-spacing:0}
:root[data-skin="v2"] .tile .v{color:var(--ink);font-weight:600}
:root[data-skin="v2"] .vhead h1{font-size:28px}
:root[data-skin="v1"] .vhead h1{font-size:30px}
/* v3: command-line headline */
:root[data-skin="v3"] .vhead h1{font-family:var(--f-mono);font-weight:500}
/* v4.0: editorial */
:root[data-skin="v40"] .eyebrow,:root[data-skin="v40"] .vmeta{color:var(--sun-ink)}
:root[data-skin="v40"] .block>h2{font-size:28px;font-weight:500}
:root[data-skin="v40"] .btn:hover{box-shadow:var(--shadow)}
/* now: colour, depth and motion */
:root[data-skin] .shapes{display:none}
:root:not([data-skin]) .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
:root:not([data-skin]) .block>h2{font-size:28px}
@media (prefers-reduced-motion:no-preference){
  :root:not([data-skin]) .view>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
  :root:not([data-skin]) .view>*:nth-child(2){animation-delay:.06s}
  :root:not([data-skin]) .view>*:nth-child(3){animation-delay:.12s}
  :root:not([data-skin]) .view>*:nth-child(4){animation-delay:.18s}
  :root[data-skin="v40"] .vhead{animation:rise .4s ease-out both}
}

@media (max-width:700px){
  .cover-hero{grid-template-columns:1fr} .shapes{display:none}
  .thesis,.why{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  .ppanel{grid-template-columns:1fr;gap:14px}
  .ptab{font-size:15px;padding:10px 12px}
  .tiles{grid-template-columns:1fr 1fr}
  .panels{grid-template-columns:1fr}
  .ship li{grid-template-columns:1fr;gap:4px} .tag{justify-self:start}
  .jump span,.polish .pl{display:none}
  .meter{width:64px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== layout width ===== */
.wrap{max-width:1000px}
.bigver{font-size:calc(clamp(34px,5vw,52px) * (0.8 + var(--hero) * 0.2))}

/* ===== browser frames ===== */
.fr{margin-top:16px;overflow:hidden;box-shadow:var(--shadow)}
.fr-body{background:var(--bg)}
.fr-page{padding:0 clamp(14px,3vw,32px) 32px}
.fr-page .vhead{padding-top:22px}
/* v1 · 2018 */
.fr-v1{border:2px outset var(--line);background:var(--bar-bg);padding:2px}
.fr1-title{display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(90deg,#000080,#1084d0);color:#ffffff;font:bold 13px Arial,sans-serif;padding:3px 4px 3px 8px}
.fr1-title span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr1-btns{display:flex;gap:2px;flex:none}
.fr1-btns i{width:16px;height:14px;display:grid;place-items:center;background:var(--btn-bg);color:var(--ink);border:1px outset var(--line);font:bold 10px Arial,sans-serif;font-style:normal}
.fr1-menu{display:flex;gap:14px;padding:3px 8px;font:13px Arial,sans-serif;color:var(--bar-ink)}
.fr1-tools{display:flex;align-items:center;gap:6px;padding:4px 6px;border-top:1px solid var(--line);font:13px Arial,sans-serif;color:var(--bar-ink)}
.fr1-b{font:12px Arial,sans-serif;background:var(--btn-bg);color:var(--ink);border:2px outset var(--line);padding:2px 8px;cursor:pointer;white-space:nowrap}
.fr1-b:active{border-style:inset}
.fr1-b:disabled{opacity:.45;cursor:default}
.fr1-addr{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.fr1-addr span{flex:1;min-width:0;background:var(--surface);color:var(--ink);border:2px inset var(--line);padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr-v1 .fr-body{border:2px inset var(--line)}
.fr1-status{display:flex;justify-content:space-between;gap:6px;padding:3px 2px 1px;font:12px Arial,sans-serif;color:var(--bar-ink)}
.fr1-status span{border:1px inset var(--line);padding:0 8px}
.fr1-status span:first-child{flex:1}
/* v2 → v4.3 · one browser, refined each era */
.frb{border:1px solid var(--line);background:var(--surface)}
.dots3{display:flex;gap:6px;flex:none}
.dots3 i{width:11px;height:11px;border-radius:50%;background:var(--muted);opacity:.45}
.frb-tabs{display:flex;align-items:flex-end;gap:2px;padding:8px 10px 0;background:var(--line);overflow:hidden}
.frb-tabs .dots3{margin-right:10px;padding-bottom:9px}
.frb-tab{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:6px 6px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;min-width:0}
.frb-tab.on{background:var(--surface);color:var(--ink)}
.frb-tab i{width:9px;height:9px;border-radius:3px;background:var(--accent);flex:none}
.frb-tab:not(.on) i{background:var(--muted);opacity:.5}
.frb-new{color:var(--muted);padding:6px 8px 7px;font-size:15px;line-height:1}
.frb-bar{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.frb-bar>.dots3{margin-right:8px}
.frb-nav{background:none;border:0;font-size:15px;line-height:1;color:var(--muted);cursor:pointer;padding:5px 8px;border-radius:var(--rb)}
button.frb-nav:hover:not(:disabled){background:var(--soft);color:var(--ink)}
.frb-nav:disabled{opacity:.35;cursor:default}
.frb-rl{cursor:default}
.frb-addr{flex:1;min-width:0;margin-left:6px;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:var(--rb);padding:5px 14px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.frb-addr svg{flex:none}
.lk{fill:none;stroke:var(--muted);stroke-width:1.3}
.frb-menu{color:var(--muted);padding:0 4px 0 10px;font-size:16px}
.frb-marks{display:flex;gap:18px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap}
.frb-marks span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:6px}
.fr-v2{border-radius:6px}
.fr-v2 .frb-addr{border-radius:3px}
.fr-v3{border-radius:10px}
.fr-v3 .frb-tabs{background:var(--soft)}
.fr-v40{border-radius:14px}
.fr-v40 .frb-tabs{background:var(--soft);padding-top:10px}
.fr-v40 .frb-tab{border-radius:10px 10px 0 0}
.fr-now{border-radius:22px}
.fr-now .frb-bar{gap:6px;padding:10px 14px;background:var(--soft)}
.fr-now .frb-addr{flex:0 1 440px;margin:0 auto;justify-content:center;background:var(--surface);border:1px solid var(--line)}

/* ===== charts ===== */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.chart{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.chart h3{font-size:15px}
.chart.wide{grid-column:1/-1}
.cap{font-size:12px;color:var(--muted);margin:0}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,92px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hbar .tr{height:16px;background:var(--soft);border-radius:var(--rb);overflow:hidden}
.hbar .fl{height:100%;background:var(--c);border-radius:var(--rb)}
.hbar b{font:600 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.hbar .fl{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}}
@keyframes grow{from{width:0}}
.c-ax{stroke:var(--line);stroke-width:1}
.c-t{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.c-ln{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.c-pt{fill:var(--accent)} .c-pt.end{fill:var(--mint)}
.c-v{fill:var(--ink);font-family:var(--f-body);font-weight:600;font-size:12px}
.waffle{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:5px;max-width:560px}
.waffle i{aspect-ratio:1;border-radius:50%;background:var(--line);transition:background-color .35s}
.waffle i.en{background:var(--accent)}
.waffle.on i{background:var(--mint)} .waffle.on i.en{background:var(--accent)}
.wf-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.wf-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.wf-legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.flow-wrap{overflow-x:auto}
.flow-wrap svg{min-width:540px}
.f-box{fill:var(--soft);stroke:var(--line)} .f-q{fill:var(--sun-soft);stroke:var(--sun-ink)}
.f-ok{fill:var(--mint-soft);stroke:var(--mint)} .f-ch{fill:var(--blue-soft);stroke:var(--blue)} .f-no{fill:var(--accent-soft);stroke:var(--accent)}
.f-tx{fill:var(--ink);font-family:var(--f-body);font-weight:600;font-size:13px;text-anchor:middle;dominant-baseline:middle}
.f-ar{stroke:var(--muted);stroke-width:1.5;fill:none}
.f-ah{fill:var(--muted)}
.f-lb{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.people{display:flex;gap:6px}
.people svg{width:28px;height:28px}
.pp{fill:var(--c)}
.pbody .hbars{max-width:420px}

@media (max-width:700px){
  .fr1-menu,.frb-marks,.frb-rl,.frb-menu,.frb-new{display:none}
  .frb-tab:not(.on){display:none}
  .fr1-addr b{display:none}
  .waffle{gap:3px}
}

/* ===== stories: content, then its chart ===== */
.story{padding:clamp(18px,3vw,26px);display:flex;flex-direction:column;gap:14px}
.story>h2{font-size:22px}
.story>p{margin:0;max-width:64ch;font-size:15.5px}
.story .chart{padding:16px 0 0;border-top:1px dashed var(--line)}
.story .chart h3{font-size:12px;font-family:var(--f-mono);font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chart-rel svg{max-width:460px}
.story .hbars{max-width:560px}
.closing{display:flex;flex-direction:column;gap:10px;background:var(--blue-soft);border-radius:var(--r);padding:22px}


/* ===== cover: owned ===== */
.owned{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.own{display:flex;flex-direction:column;gap:6px;padding:18px;text-align:left;cursor:pointer;border-top:5px solid var(--c);font:inherit;color:var(--ink);transition:transform var(--dur),box-shadow var(--dur)}
.own:hover{transform:translateY(-2px)}
.own .n{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3vw,30px);line-height:1.05;color:var(--c)}
.own p{margin:0;font-size:13.5px;color:var(--muted)}
.own .go{margin-top:auto;padding-top:6px;font:12px var(--f-mono);color:var(--c)}
/* ===== personal line ===== */
.vhead .care{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:15.5px;color:var(--ink);margin-top:4px}
.vhead .care span{font:11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:var(--rb)}
/* ===== campaign ===== */
.camp{padding:clamp(18px,3vw,26px);display:flex;flex-direction:column;gap:16px}
.camp>h2{font-size:24px}
.camp>p{margin:0;max-width:64ch}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;list-style:none;padding:0;margin:0}
.steps3 li{background:var(--soft);border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.steps3 b{font:11px var(--f-mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.camp-chart{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:16px}
.camp-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.camp-top h3{font-size:16px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--rb);padding:3px;gap:2px;background:var(--surface)}

/* ================= v13 redesign: bright white, professional ================= */
:root:not([data-skin]){--bg:#ffffff;--surface:#ffffff;--ink:#0b0b0c;--muted:#66666e;--line:#e9e9ec;--soft:#f6f6f7;--accent:#1f5eff;--accent-soft:#eef3ff;--on-accent:#ffffff;--blue:#1f5eff;--blue-soft:#eef3ff;--sun:#f5b301;--sun-soft:#fff8e6;--sun-ink:#9a6700;--mint:#12a150;--mint-soft:#e9f8ef;--dep:#a1a1aa;--dep-soft:#f2f2f3;--term-bg:#0b0b0c;--term-ink:#f5f5f5;--title:#0b0b0c;--bar-bg:rgba(255,255,255,.88);--bar-ink:#0b0b0c;--btn-bg:#ffffff;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px -10px rgba(0,0,0,.10);

@media (prefers-color-scheme: dark){:root:not([data-skin]):not([data-theme="light"]){--bg:#0a0a0b;--surface:#131315;--ink:#ededef;--muted:#9b9ba3;--line:#26262b;--soft:#1a1a1d;--accent:#5c8bff;--accent-soft:#172340;--on-accent:#0a0a0b;--blue:#5c8bff;--blue-soft:#172340;--sun:#f5c24a;--sun-soft:#2b2414;--sun-ink:#f5c24a;--mint:#3ccf7d;--mint-soft:#13281c;--dep:#6b6b73;--dep-soft:#1d1d20;--term-bg:#000000;--term-ink:#ededef;--title:#ededef;--bar-bg:rgba(19,19,21,.88);--bar-ink:#ededef;--btn-bg:#131315;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]:not([data-skin]){--bg:#0a0a0b;--surface:#131315;--ink:#ededef;--muted:#9b9ba3;--line:#26262b;--soft:#1a1a1d;--accent:#5c8bff;--accent-soft:#172340;--on-accent:#0a0a0b;--blue:#5c8bff;--blue-soft:#172340;--sun:#f5c24a;--sun-soft:#2b2414;--sun-ink:#f5c24a;--mint:#3ccf7d;--mint-soft:#13281c;--dep:#6b6b73;--dep-soft:#1d1d20;--term-bg:#000000;--term-ink:#ededef;--title:#ededef;--bar-bg:rgba(19,19,21,.88);--bar-ink:#ededef;--btn-bg:#131315;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}

/* calmer components, every era after v1 */

.tldr{padding:clamp(18px,3vw,26px);display:flex;flex-direction:column;gap:14px;align-items:flex-start}

/* journey + changelog */

.sb-row label b{margin-left:auto;font:600 13px var(--f-mono)}
.sb-dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.sb-n{font:12px var(--f-mono);color:var(--muted)}
.sb-out{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:var(--r);background:var(--soft);align-items:flex-start}
.sb-big{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sb-meter{width:100%;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.sb-meter i{display:block;height:100%;background:var(--mint);transition:width .3s}
.sb-stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line)}
.sb-stack i{display:block;height:100%;background:var(--c);transition:width .3s}
/* finale + recap */
.finale{padding:clamp(20px,3vw,30px);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.finale h2{font-size:28px}
.finale p{margin:0;color:var(--muted)}
.finale .contact{width:100%;max-width:520px}
.finale.done{border-color:var(--mint)}
.appr-chip{display:inline-flex;gap:6px;padding:4px 10px;border-radius:999px;background:var(--mint-soft);color:var(--mint);font:600 13px var(--f-mono)}
.recap-wrap{display:flex;flex-direction:column;gap:8px}
.recap{aspect-ratio:1.91/1;max-width:100%;padding:clamp(18px,3.4vw,36px);border-radius:16px;background:#0b0b0c;color:#f5f5f5;display:flex;flex-direction:column;gap:clamp(10px,2vw,20px);overflow:hidden}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.rc-name{display:block;font-family:var(--f-display);font-size:clamp(20px,3vw,30px);font-weight:700;letter-spacing:-.02em}
.rc-sub{font:12px var(--f-mono);opacity:.7}
.rc-tag{font:12px var(--f-mono);padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#9db6ff}
.rc-body{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(14px,3vw,30px);flex:1;min-height:0}
.rc-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:clamp(12px,1.4vw,14px)}
.rc-list li{display:grid;grid-template-columns:42px 1fr;gap:8px}
.rc-list b{font:12px var(--f-mono);opacity:.65;padding-top:1px}
.rc-nums{display:flex;flex-direction:column;gap:12px;justify-content:center}
.rc-nums span{display:block;font-family:var(--f-display);font-size:clamp(22px,3.4vw,34px);font-weight:700;letter-spacing:-.02em;color:#ffffff}
.rc-nums small{font-size:12px;opacity:.7}
.rc-foot{display:flex;gap:18px;flex-wrap:wrap;font:13px var(--f-mono);opacity:.85;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}
/* cliffhangers */
.foot-next{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
.tease{font-size:14px;color:var(--muted);max-width:42ch}
/* v1 banner is a button now */
.fr-v1 .retro{width:100%;border:0;border-bottom:2px solid #000;cursor:pointer;font:14px "Times New Roman",serif;color:#000;background:#ffff00;padding-block:6px}
.fr-v1 .retro:hover{text-decoration:underline}

  function hook(replay){
    var dots=[].slice.call(document.querySelectorAll("#hookDots i"));if(!dots.length)return;
    var order=dots.map(function(_,i){return i});var seed=7;order.sort(function(){seed=(seed*9301+49297)%233280;return seed/233280-.5});

      function step(ts){
        if(!$("hookDots"))return;
        if(start===null)start=ts;var t=Math.min(1,(ts-start)/dur);

        for(;done<gone;done++)dots[fade[done]].className="gone";

        if(t<1)requestAnimationFrame(step);else{$("hookCap").textContent="Day 30: only 25 are still using it.";$("hookJob").classList.add("on")}

    },replay?200:700);
  }

      var i=+s.dataset.sb,v=+s.value,others=[0,1,2].filter(function(k){return k!==i}),rest=100-v,sum=mix[others[0]]+mix[others[1]];
      mix[i]=v;
      if(sum===0){mix[others[0]]=rest;mix[others[1]]=0}else{var a=Math.round(rest*mix[others[0]]/sum/5)*5;mix[others[0]]=a;mix[others[1]]=rest-a}
      sbUpdate();
    })});
    if((x=$("sbBest")))x.addEventListener("click",function(){mix=BEST.m.slice();sbUpdate()});
    if((x=$("approveBtn")))x.addEventListener("click",function(){
      var d=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
      function done(c){approved={date:d,copied:c};$("curPill").textContent="v5.0 · approved";rerender(null);var f=document.querySelector(".finale");if(f)f.scrollIntoView({block:"center"})}
      copyText(EMAIL,function(){done(true)},function(){done(false)});
    });
    var wb=$("wfBtn");
    if(wb)wb.addEventListener("click",function(){
      wfOn=!wfOn;$("waffle").classList.toggle("on",wfOn);
      wb.textContent=wfOn?"Turn off auto-translate":"Turn on auto-translate";wb.classList.toggle("primary",!wfOn);wb.setAttribute("aria-pressed",wfOn);
      $("wfOther").style.setProperty("--c",wfOn?"var(--mint)":"var(--line)");
      $("wfCap").textContent=wfOn?"Outlook Lite's lightweight translation was built for the other 90%.":"Email mostly served only the English-speaking 10%.";
    });
  }

  /* ================= THEME ================= */
  var mq=matchMedia("(prefers-color-scheme: dark)");
  function curDark(){var t=document.documentElement.getAttribute("data-theme");return t?t==="dark":mq.matches}
  function setThemeBtn(){var d=curDark(),b=$("themeBtn");b.textContent=d?"☀ Light":"☾ Dark";b.setAttribute("aria-label",d?"Switch to light mode":"Switch to dark mode")}
  try{var saved=localStorage.getItem("bala-theme");if(saved==="dark"||saved==="light")document.documentElement.setAttribute("data-theme",saved)}catch(e){}
  $("themeBtn").addEventListener("click",function(){var n=curDark()?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("bala-theme",n)}catch(e){}setThemeBtn()});
  if(mq.addEventListener)mq.addEventListener("change",setThemeBtn);
  setThemeBtn();
  go();
})();
